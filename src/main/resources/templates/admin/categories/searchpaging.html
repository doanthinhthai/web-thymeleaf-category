<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layout-admin}">
<!-- Kế thừa toàn bộ khung layout-admin -->
<head>
<title>Danh Sách Danh Mục</title>
</head>
<body>
	<!-- Đoạn này sẽ được lắp đúng vào thẻ <div layout:fragment="content"> của layout-admin -->
	<section layout:fragment="content">
		<div class="card shadow-sm">
			<!-- Card Header -->
			<div
				class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
				<h5 class="mb-0">
					<i class="bi bi-list-stars me-2"></i> Danh Sách Category
				</h5>
				<a th:href="@{/admin/categories/add}"
					class="btn btn-warning btn-sm fw-bold"> <i
					class="bi bi-plus-circle"></i> Thêm mới Category
				</a>
			</div>

			<div class="card-body">
				<!-- Thông báo message thành công -->
				<div th:if="${message != null}"
					class="alert alert-success alert-dismissible fade show"
					role="alert">
					<i class="bi bi-check-circle-fill me-1"></i> <span
						th:text="${message}"></span>
					<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
				</div>

				<!-- Form tìm kiếm  -->
				<form th:action="@{/admin/categories/searchpaginated}" method="get"
					class="row g-2 mb-4">
					<div class="col-md-9">
						<div class="input-group">
							<span class="input-group-text"><i class="bi bi-search"></i></span>
							<input type="text" class="form-control" name="name"
								th:value="${name}" placeholder="Nhập tên Category cần tìm...">
						</div>
					</div>
					<div class="col-md-3 d-flex gap-2">
						<button type="submit" class="btn btn-primary w-100">Tìm
							kiếm</button>
						<a th:href="@{/admin/categories/searchpaginated}"
							class="btn btn-secondary">Reset</a>
					</div>
				</form>

				<!-- Bảng hiển thị dữ liệu -->
				<div class="table-responsive">
					<table th:if="${categoryPage.hasContent()}"
						class="table table-striped table-hover table-bordered align-middle">
						<thead class="table-dark">
							<tr>
								<th style="width: 100px;">Mã số</th>
								<th>Tên Category</th>
								<th style="width: 130px;">Trạng thái</th>
								<th style="width: 180px;" class="text-center">Thao tác</th>
							</tr>
						</thead>
						<tbody>
							<!-- Duyệt qua danh sách Category trong trang hiện tại -->
							<tr th:each="category : ${categoryPage.content}">
								<td class="fw-bold" th:text="${category.categoryId}"></td>
								<td th:text="${category.name}"></td>
								<td><span th:if="${category.status == 1}"
									class="badge bg-success">Hoạt động</span> <span
									th:unless="${category.status == 1}" class="badge bg-secondary">Khóa</span>
								</td>
								<td class="text-center"><a
									th:href="@{'/admin/categories/edit/' + ${category.categoryId}}"
									class="btn btn-sm btn-outline-warning me-1"> <i
										class="bi bi-pencil-square"></i> Sửa
								</a> <a
									th:href="@{'/admin/categories/delete/' + ${category.categoryId}}"
									class="btn btn-sm btn-outline-danger"
									onclick="return confirm('Bạn có chắc chắn muốn xóa Category này?')">
										<i class="bi bi-trash"></i> Xóa
								</a></td>
							</tr>
						</tbody>
					</table>

					<!-- Thông báo khi tìm kiếm không ra kết quả -->
					<div th:unless="${categoryPage.hasContent()}"
						class="alert alert-danger text-center py-3">
						<i class="bi bi-exclamation-triangle-fill me-2"></i> Không tìm
						thấy Category nào phù hợp!
					</div>
				</div>
			</div>

			<!-- Thanh phân trang Bootstrap -->
			<div
				class="card-footer bg-white d-flex justify-content-between align-items-center"
				th:if="${categoryPage.totalPages > 0}">
				<div>
					Trang <strong th:text="${categoryPage.number + 1}"></strong> / <strong
						th:text="${categoryPage.totalPages}"></strong> (Tổng: <span
						th:text="${categoryPage.totalElements}"></span> dòng)
				</div>

				<nav aria-label="Page navigation">
					<ul class="pagination mb-0">
						<!-- Nút trang Đầu -->
						<li
							th:class="${1 == categoryPage.number + 1} ? 'page-item disabled' : 'page-item'">
							<a class="page-link"
							th:href="@{/admin/categories/searchpaginated(name=${name}, size=${categoryPage.size}, page=1)}">Đầu</a>
						</li>

						<!-- Các số trang động (1, 2, 3...) -->
						<li th:each="pageNumber : ${pageNumbers}"
							th:class="${pageNumber == categoryPage.number + 1} ? 'page-item active' : 'page-item'">
							<a class="page-link"
							th:href="@{/admin/categories/searchpaginated(name=${name}, size=${categoryPage.size}, page=${pageNumber})}"
							th:text="${pageNumber}"></a>
						</li>

						<!-- Nút trang Cuối -->
						<li
							th:class="${categoryPage.totalPages == categoryPage.number + 1} ? 'page-item disabled' : 'page-item'">
							<a class="page-link"
							th:href="@{/admin/categories/searchpaginated(name=${name}, size=${categoryPage.size}, page=${categoryPage.totalPages})}">Cuối</a>
						</li>
					</ul>
				</nav>
			</div>
		</div>
	</section>
</body>
</html>
