server.port=8080

# 1. Tắt cache Thymeleaf để sửa giao diện là thấy ngay
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# 2. Kết nối SQL Server (nhớ kiểm tra mật khẩu sa đúng với máy bạn)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=spring_thymeleaf_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
	
# 3. Hibernate tự tạo bảng Categories trong SQL Server
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect